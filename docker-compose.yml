version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: catalogo-postgres
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
