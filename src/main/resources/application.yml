spring:
  application:
    name: catalogo

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo}
    username: ${DB_USER:catalogo}
    password: ${DB_PASSWORD:catalogo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  graphql:
    graphiql:
      enabled: true
    schema:
      locations: classpath:graphql/
    websocket:
      path: /graphql

server:
  port: 8080
