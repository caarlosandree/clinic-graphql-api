# Nota: Filtre por scheduledAt >= NOW() no servidor se necessário

# ============================================
# 15. Validar integridade: agendamentos com procedimento e profissional da mesma clínica
# ============================================
query ValidateAppointmentIntegrity {
  appointments {
    id
    patientName
    clinic {
      id
      name
    }
    procedure {
      id
      name
      clinic {
        id
        name
      }
    }
    professional {
      id
      name
      clinic {
        id
        name
      }
    }
  }
}
# Verifique se clinic.id == procedure.clinic.id == professional.clinic.id

